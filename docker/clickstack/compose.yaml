services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.47.0
    restart: unless-stopped
    environment:
      FRONTEND_URL: https://clickstack.app.home.arpa
      EXPRESS_SESSION_SECRET: ${CLICKSTACK_SESSION_SECRET:?CLICKSTACK_SESSION_SECRET not set}
      USAGE_STATS_ENABLED: "false"
      HYPERDX_OTEL_EXPORTER_TABLES_TTL: 240h
      TZ: ${TZ:?TZ not set}
    volumes:
      - ${DATA_DIR:?DATA_DIR not set}/clickstack/db:/data/db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null && curl -fsS http://localhost:8123/ping >/dev/null && curl -fsS http://localhost:13133 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
