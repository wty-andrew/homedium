services:
  valkey:
    image: valkey/valkey:9.1.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:?TZ not set}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD not set}
    command: >
      valkey-server
      --requirepass ${VALKEY_PASSWORD}
      --appendonly yes
      --save 60 1000
    volumes:
      - ${DATA_DIR:?DATA_DIR not set}/valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 30s

  valkey-admin:
    image: valkey/valkey-admin:1.3.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:?TZ not set}
      DEPLOYMENT_MODE: Web
      VALKEY_USERNAME: default
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD not set}
      VALKEY_ADMIN_ALLOWED_WS_ORIGINS: https://valkey-admin.app.home.arpa
    depends_on:
      valkey:
        condition: service_healthy
