services:
  caddy:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "222:222" # forgejo
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/root/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        aliases:
          - s3.app.home.arpa # container can't resolve *.app.home.arpa, required for plane-aio

volumes:
  caddy-data:
  caddy-config:
