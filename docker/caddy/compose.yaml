services:
  caddy:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "222:222" # forgejo
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/root/certs:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
