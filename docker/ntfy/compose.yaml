services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.2
    command: serve
    init: true
    restart: unless-stopped
    environment:
      TZ: ${TZ:?TZ not set}
    volumes:
      - ./config/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:2586/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ntfy-cache:
